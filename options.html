<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Osusume Kenon</title>
<style>
  body { font: 15px/1.7 system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #1d2a35; }
  label { display: flex; gap: 10px; align-items: flex-start; }
  input { margin-top: 6px; }
  .note { color: #555; font-size: 13px; margin: 4px 0 0 26px; }
  h2 { font-size: 17px; margin: 28px 0 4px; }
  table { border-collapse: collapse; margin: 8px 0 0 26px; font-size: 13px; }
  th, td { border-bottom: 1px solid #d8dee4; padding: 4px 10px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  .muted { color: #8a949e; }
  .bar { display: block; height: 6px; background: #c9533d; margin-top: 2px; }
  .bar.following { background: #4a7fb5; }
  .warn { color: #8a4b00; }
  button { margin-right: 6px; }
</style>
</head>
<body>
<h1 data-i18n="title"></h1>
<p class="note"><label><span data-i18n="langLabel"></span> <select id="lang"><option value="auto" data-i18n="langAuto"></option><option value="ja">日本語</option><option value="en">English</option></select></label></p>
<section>
  <label><input type="checkbox" id="foldEnabled"> <span data-i18n="foldLabel"></span></label>
  <p class="note" data-i18n="foldNote"></p>
  <p class="note"><label><span data-i18n="foldLevelLabel"></span> <select id="foldThreshold"><option value="70" data-i18n="foldLevelStd"></option><option value="40" data-i18n="foldLevelLow"></option><option value="20" data-i18n="foldLevelMin"></option></select></label></p>
  <p class="note" id="foldCount"></p>
  <p class="note muted" id="foldDiag"></p>
</section>
<section>
  <label><input type="checkbox" id="recordEnabled"> <span data-i18n="recLabel"></span></label>
  <p class="note" data-i18n="recNote"></p>
  <p class="note"><span data-i18n="recCountLabel"></span> <span id="recCount">…</span></p>
  <p class="note"><button type="button" id="recStrip" data-i18n="recStrip"></button><button type="button" id="recDelete" data-i18n="recDelete"></button></p>
</section>
<section>
  <h2 data-i18n="trendH"></h2>
  <p class="note" id="trendNote">…</p>
  <table id="trendTable" hidden></table>
  <table id="dayTable" hidden></table>
  <p class="note" data-i18n="trendFoot"></p>
</section>
<section>
  <h2 data-i18n="sessH"></h2>
  <p class="note" data-i18n="sessNote"></p>
  <p class="note"><button type="button" id="sessStart" data-i18n="sessStart"></button><button type="button" id="sessEnd" hidden data-i18n="sessEnd"></button></p>
  <p class="note" id="sessProgress"></p>
  <table id="sessTable" hidden></table>
  <p class="note" id="sessDiff"></p>
</section>
<section>
  <details>
    <summary data-i18n="helpSummary"></summary>
    <p class="note" data-i18n="help1"></p>
    <p class="note" data-i18n="help2"></p>
    <p class="note" data-i18n="help3"></p>
    <p class="note" data-i18n="help4"></p>
    <p class="note" data-i18n="help5"></p>
  </details>
</section>
<section>
  <h2 data-i18n="logH"></h2>
  <label><input type="checkbox" id="debugEnabled"> <span data-i18n="logLabel"></span></label>
  <p class="note" data-i18n="logNote"></p>
  <p class="note"><button type="button" id="logCopy" data-i18n="logCopy"></button><button type="button" id="logClear" data-i18n="logClear"></button> <span id="logCount"></span></p>
  <pre id="logView" class="note" style="max-height:240px;overflow:auto;white-space:pre-wrap;font-size:11px" hidden></pre>
</section>
<p id="saved" class="note" aria-live="polite"></p>
<script src="i18n.js"></script>
<script src="record-core.js"></script>
<script src="stats-core.js"></script>
<script src="options.js"></script>
</body>
</html>
